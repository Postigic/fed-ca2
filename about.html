<!doctype html>
<html lang="en">
    <head>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400..600&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css"
        />
        <link href="./dist/output.css" rel="stylesheet" />
        <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
        <script type="module" src="./js/index.js"></script>

    <body class="bg-background text-foreground font-sans">
        <button
            id="sidebar-btn"
            class="bg-surface-2 border-border hover:bg-surface fixed top-4 left-4 z-50 flex h-10 w-10 flex-col items-center justify-center gap-1.5 rounded-sm border transition-all duration-200 md:hidden"
            aria-label="Open menu"
        >
            <span
                class="bar bg-foreground block h-0.5 w-5 rounded-full"
                aria-hidden="true"
            ></span>
            <span
                class="bar bg-foreground block h-0.5 w-5 rounded-full"
                aria-hidden="true"
            ></span>
            <span
                class="bar bg-foreground block h-0.5 w-5 rounded-full"
                aria-hidden="true"
            ></span>
        </button>
        <header>
            <!-- injected via JS -->
            <nav id="navbar"></nav>
        </header>

        <div class="p-12 px-54 w-full">
            <h1 class="font-extrabold text-2xl">Meet the Team</h1>
            <br>
            <div class="align-centre flex flex-wrap flex-row font-bold border-indigo-500 items-stretch items-center w-full">
                
                <div class="p-10 m-2 text-s border-2 rounded-md border-[#a8bccc] bg-[#4f6577] flex flex-col justify-center">
                    <img class="">
                    <p>Dev Number 1</p>

                <p class="p-10 m-2 text-s border-2 rounded-md border-[#a8bccc] bg-[#4f6577]">Dev Number 2</p>

            </div>
            <br>
            <h1 class="font-extrabold text-2xl">Frequently Asked Questions</h1>
            <br> 
            <div class="border-b border-[border-gray-500] overflow-hidden rounded-l">
                <div class="border-b border-[border-gray-500] w-full">
                    <button class="flex w-full justify-between items-center px-4 py-3.5">
                        <span>Who made this site?</span>
                        <svg class="w-8 h-8 transition-transform" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />

                    <button class="flex w-full justify-between items-center px-4 py-3.5">
                        <span>Is this site kid-friendly?</span>
                        <svg class="w-8 h-8 transition-transform" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />

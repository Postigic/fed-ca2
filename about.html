<!doctype html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400..600&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css"
        />
        <link href="./dist/output.css" rel="stylesheet" />
        <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
        <script type="module" src="./js/about.js"></script>
        <title>About</title>
        <style>
            @keyframes alert-in {
                from {
                    opacity: 0;
                    transform: translateY(-8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .alert-enter {
                animation: alert-in 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            }

            .alert-row {
                display: grid;
                grid-template-rows: 0fr;
                transition: grid-template-rows 0.35s
                    cubic-bezier(0.22, 1, 0.36, 1);
            }

            .alert-row.expanded {
                grid-template-rows: 1fr;
            }
        </style>
    </head>

    <body class="bg-background text-foreground font-sans">
        <button
            id="sidebar-btn"
            class="bg-surface-2 border-border hover:bg-surface fixed top-4 left-4 z-50 flex h-10 w-10 flex-col items-center justify-center gap-1.5 rounded-sm border transition-all duration-200 md:hidden"
            aria-label="Open menu"
        >
            <span
                class="bar bg-foreground block h-0.5 w-5 rounded-full"
                aria-hidden="true"
            ></span>
            <span
                class="bar bg-foreground block h-0.5 w-5 rounded-full"
                aria-hidden="true"
            ></span>
            <span
                class="bar bg-foreground block h-0.5 w-5 rounded-full"
                aria-hidden="true"
            ></span>
        </button>

        <header>
            <!-- injected via JS -->
            <nav id="navbar"></nav>
        </header>

        <div class="md:ml-48">
            <main class="flex-1">
                <!-- ======= PAGE HEADING ======= -->

                <section
                    id="intro"
                    class="mx-auto max-w-6xl px-6 pt-20 pb-10 md:pt-24 md:pb-14 xl:max-w-7xl"
                >
                    <div class="mx-auto max-w-5xl">
                        <p
                            class="text-primary animate-target mb-3 font-mono text-xs tracking-[0.35em] uppercase"
                        >
                            About
                        </p>
                        <h1
                            class="font-display animate-target text-3xl font-semibold tracking-tight md:text-5xl xl:text-6xl"
                        >
                            The Team Behind Universe Explorer
                        </h1>
                    </div>
                </section>

                <!-- ======= TEAM SECTION ======= -->

                <section
                    id="team"
                    aria-labelledby="team-heading"
                    class="animate-target mb-24 px-6 md:mb-32 xl:mb-40"
                >
                    <div class="mx-auto max-w-5xl">
                        <h2
                            id="team-heading"
                            class="font-display animate-target mb-8 text-2xl font-semibold tracking-tight md:text-4xl xl:text-5xl"
                        >
                            Meet the Team
                        </h2>

                        <ul
                            class="animate-target flex w-full list-none flex-row flex-wrap items-stretch gap-4"
                        >
                            <li class="flex flex-1">
                                <figure
                                    class="border-border bg-surface shadow-elevated animate-target flex w-full flex-col items-center justify-center gap-3 rounded-sm border p-10 font-bold"
                                >
                                    <img
                                        class="w-28 rounded-full"
                                        src="https://placehold.co/400"
                                        alt="Dev Number 1"
                                    />
                                    <figcaption class="text-sm">
                                        Dev Number 1
                                    </figcaption>
                                </figure>
                            </li>
                            <li class="flex flex-1">
                                <figure
                                    class="border-border bg-surface shadow-elevated animate-target flex w-full flex-col items-center justify-center gap-3 rounded-sm border p-10 font-bold"
                                >
                                    <img
                                        class="w-28 rounded-full"
                                        src="https://placehold.co/400"
                                        alt="Dev Number 2"
                                    />
                                    <figcaption class="text-sm">
                                        Dev Number 2
                                    </figcaption>
                                </figure>
                            </li>
                            <li class="flex flex-1">
                                <figure
                                    class="border-border bg-surface shadow-elevated animate-target flex w-full flex-col items-center justify-center gap-3 rounded-sm border p-10 font-bold"
                                >
                                    <img
                                        class="w-28 rounded-full"
                                        src="https://placehold.co/400"
                                        alt="Dev Number 3"
                                    />
                                    <figcaption class="text-sm">
                                        Dev Number 3
                                    </figcaption>
                                </figure>
                            </li>
                            <li class="flex flex-1">
                                <figure
                                    class="border-border bg-surface shadow-elevated animate-target flex w-full flex-col items-center justify-center gap-3 rounded-sm border p-10 font-bold"
                                >
                                    <img
                                        class="w-28 rounded-full"
                                        src="https://placehold.co/400"
                                        alt="Dev Number 4"
                                    />
                                    <figcaption class="text-sm">
                                        Dev Number 4
                                    </figcaption>
                                </figure>
                            </li>
                        </ul>
                    </div>
                </section>

                <!-- ======= FAQ SECTION ======= -->

                <section
                    id="faq"
                    aria-labelledby="faq-heading"
                    class="animate-target mb-24 px-6 md:mb-32 xl:mb-40"
                >
                    <div class="mx-auto max-w-5xl">
                        <h2
                            id="faq-heading"
                            class="font-display animate-target mb-8 text-2xl font-semibold tracking-tight md:text-4xl xl:text-5xl"
                        >
                            Frequently Asked Questions
                        </h2>

                        <div id="faq-list" class="flex flex-col gap-3"></div>
                    </div>
                </section>

                <!-- ======= CONTACT SECTION ======= -->

                <section
                    id="contact"
                    aria-labelledby="contact-heading"
                    class="animate-target mb-24 px-6 pb-24 md:mb-32 md:pb-32 xl:mb-40"
                >
                    <div class="mx-auto max-w-5xl">
                        <h2
                            id="contact-heading"
                            class="font-display animate-target mb-8 text-2xl font-semibold tracking-tight md:text-4xl xl:text-5xl"
                        >
                            Send Feedback / Contact Us
                        </h2>

                        <form id="contact-form" novalidate>
                            <div
                                class="border-border bg-surface shadow-elevated animate-target flex w-full flex-col rounded-sm border"
                            >
                                <div
                                    class="animate-target flex w-full flex-col items-stretch justify-between gap-4 p-8"
                                >
                                    <label for="email" class="sr-only">
                                        Email address
                                    </label>
                                    <input
                                        id="email"
                                        type="email"
                                        name="email"
                                        placeholder="Enter your email address"
                                        maxlength="254"
                                        required
                                        aria-describedby="form-alert"
                                        autocomplete="email"
                                        class="border-border focus:border-primary animate-target rounded-sm border bg-transparent px-6 py-3 transition-colors duration-200 outline-none"
                                    />
                                    <label for="message" class="sr-only">
                                        Message
                                    </label>
                                    <textarea
                                        id="message"
                                        name="message"
                                        rows="8"
                                        placeholder="Enter your message."
                                        maxlength="5000"
                                        required
                                        aria-describedby="form-alert"
                                        class="border-border focus:border-primary animate-target resize-none rounded-sm border bg-transparent px-6 py-4 text-left align-top transition-colors duration-200 outline-none"
                                    ></textarea>
                                </div>

                                <div id="form-alert-row" class="alert-row mx-8">
                                    <div class="overflow-hidden">
                                        <p
                                            id="form-alert"
                                            role="alert"
                                            class="mb-8 rounded-sm border py-4 text-center font-bold"
                                        ></p>
                                    </div>
                                </div>

                                <div class="animate-target px-8 pb-8">
                                    <button
                                        type="submit"
                                        id="submit-btn"
                                        class="border-primary text-primary hover:bg-primary hover:text-background shadow-elevated hover:shadow-elevated-hover active:shadow-elevated transition-[color, transform, box-shadow] w-full rounded-sm border px-6 py-3 font-mono text-sm duration-200 hover:-translate-y-1 active:translate-y-0"
                                    >
                                        Submit Form
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>
            </main>

            <!-- injected via JS -->
            <footer id="footer"></footer>
        </div>
    </body>
</html>

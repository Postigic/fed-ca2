<!doctype html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400..600&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css"
        />
        <link href="./dist/output.css" rel="stylesheet" />
        <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
        <script type="module" src="./js/about.js"></script>
        <title>About</title>
        <style>
            @keyframes alert-in {
                from {
                    opacity: 0;
                    transform: translateY(-8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .alert-enter {
                animation: alert-in 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            }

            .alert-row {
                display: grid;
                grid-template-rows: 0fr;
                transition: grid-template-rows 0.35s
                    cubic-bezier(0.22, 1, 0.36, 1);
            }

            .alert-row.expanded {
                grid-template-rows: 1fr;
            }
        </style>
    </head>

    <body class="bg-background text-foreground font-sans">
        <button id="sidebar-btn" class="sidebar-toggle" aria-label="Open menu">
            <!-- injected via JS -->
        </button>

        <header>
            <!-- injected via JS -->
            <nav id="navbar"></nav>
        </header>

        <div class="page-shell">
            <main class="flex-1">
                <!-- ======= PAGE HEADING ======= -->

                <section id="intro" class="page-header animate-target">
                    <div class="narrow-container">
                        <p class="eyebrow animate-target">
                            The Team Behind Universe Explorer
                        </p>
                        <h1 class="page-title animate-target">About Us</h1>
                    </div>
                </section>

                <!-- ======= TEAM SECTION ======= -->

                <section
                    id="team"
                    aria-labelledby="team-heading"
                    class="animate-target section-gap px-6 py-10"
                >
                    <div class="narrow-container">
                        <h2
                            id="team-heading"
                            class="section-title animate-target"
                        >
                            Meet the Team
                        </h2>

                        <ul
                            class="animate-target flex w-full list-none flex-row flex-wrap items-stretch gap-4"
                        >
                            <li class="flex flex-1">
                                <figure class="team-card animate-target">
                                    <img
                                        class="team-card-avatar"
                                        src="https://placehold.co/400"
                                        alt="Dev Number 1"
                                    />
                                    <figcaption class="text-sm">
                                        Dev Number 1
                                    </figcaption>
                                </figure>
                            </li>
                            <li class="flex flex-1">
                                <figure class="team-card animate-target">
                                    <img
                                        class="team-card-avatar"
                                        src="https://placehold.co/400"
                                        alt="Dev Number 2"
                                    />
                                    <figcaption class="text-sm">
                                        Dev Number 2
                                    </figcaption>
                                </figure>
                            </li>
                            <li class="flex flex-1">
                                <figure class="team-card animate-target">
                                    <img
                                        class="team-card-avatar"
                                        src="https://placehold.co/400"
                                        alt="Dev Number 3"
                                    />
                                    <figcaption class="text-sm">
                                        Dev Number 3
                                    </figcaption>
                                </figure>
                            </li>
                            <li class="flex flex-1">
                                <figure class="team-card animate-target">
                                    <img
                                        class="team-card-avatar"
                                        src="https://placehold.co/400"
                                        alt="Dev Number 4"
                                    />
                                    <figcaption class="text-sm">
                                        Dev Number 4
                                    </figcaption>
                                </figure>
                            </li>
                        </ul>
                    </div>
                </section>

                <!-- ======= FAQ SECTION ======= -->

                <section
                    id="faq"
                    aria-labelledby="faq-heading"
                    class="animate-target section-gap px-6"
                >
                    <div class="narrow-container">
                        <h2
                            id="faq-heading"
                            class="section-title animate-target"
                        >
                            Frequently Asked Questions
                        </h2>

                        <div id="faq-list" class="flex flex-col gap-3"></div>
                    </div>
                </section>

                <!-- ======= CONTACT SECTION ======= -->

                <section
                    id="contact"
                    aria-labelledby="contact-heading"
                    class="animate-target section-gap px-6 pb-24 md:pb-32"
                >
                    <div class="narrow-container">
                        <h2
                            id="contact-heading"
                            class="section-title animate-target"
                        >
                            Send Feedback / Contact Us
                        </h2>

                        <form id="contact-form" novalidate>
                            <div
                                class="surface-panel animate-target flex w-full flex-col"
                            >
                                <div
                                    class="animate-target flex w-full flex-col items-stretch justify-between gap-4 p-8"
                                >
                                    <label for="email" class="sr-only">
                                        Email address
                                    </label>
                                    <input
                                        id="email"
                                        type="email"
                                        name="email"
                                        placeholder="Enter your email address"
                                        maxlength="254"
                                        required
                                        aria-describedby="form-alert"
                                        autocomplete="email"
                                        class="border-border focus:border-primary animate-target rounded-sm border bg-transparent px-6 py-3 transition-colors duration-200 outline-none"
                                    />
                                    <label for="message" class="sr-only">
                                        Message
                                    </label>
                                    <textarea
                                        id="message"
                                        name="message"
                                        rows="8"
                                        placeholder="Enter your message."
                                        maxlength="5000"
                                        required
                                        aria-describedby="form-alert"
                                        class="border-border focus:border-primary animate-target resize-none rounded-sm border bg-transparent px-6 py-4 text-left align-top transition-colors duration-200 outline-none"
                                    ></textarea>
                                </div>

                                <div id="form-alert-row" class="alert-row mx-8">
                                    <div class="overflow-hidden">
                                        <p
                                            id="form-alert"
                                            role="alert"
                                            class="mb-8 rounded-sm border py-4 text-center font-bold"
                                        ></p>
                                    </div>
                                </div>

                                <div class="animate-target px-8 pb-8">
                                    <button
                                        type="submit"
                                        id="submit-btn"
                                        class="btn-outline w-full"
                                    >
                                        Submit Form
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>
            </main>

            <!-- injected via JS -->
            <footer id="footer"></footer>
        </div>
    </body>
</html>

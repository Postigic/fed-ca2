<!doctype html>
<html lang="en">
    <head>
        <title>Quiz</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400..600&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css"
        />
        <link href="./dist/output.css" rel="stylesheet" />
        <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
        <script type="module" src="./js/about.js"></script>
    </head>
    <body class="bg-background text-foreground font-sans">
        <button
            id="sidebar-btn"
            class="bg-surface-2 border-border hover:bg-surface fixed top-4 left-4 z-50 flex h-10 w-10 flex-col items-center justify-center gap-1.5 rounded-sm border transition-all duration-200 md:hidden"
            aria-label="Open menu"
        >
            <span
                class="bar bg-foreground block h-0.5 w-5 rounded-full"
                aria-hidden="true"
            ></span
            ><span
                class="bar bg-foreground block h-0.5 w-5 rounded-full"
                aria-hidden="true"
            ></span
            ><span
                class="bar bg-foreground block h-0.5 w-5 rounded-full"
                aria-hidden="true"
            ></span>
        </button>
        <header>
            <!-- injected via JS -->
            <nav id="navbar"></nav>
        </header>



        <!-- MAIN CONTENT FOR QUIZ.HTML -->
        <div class="w-full p-12 sm:pl-10 md:pl-50">
            <p class="text-s font-mono text-muted">Test your space knowledge here!</p>
            <h1 class="text-5xl font-extrabold">Space Quiz</h1>
            
            <br>
            <div class="p-12 bg-[#1a1c25] rounded-xl border-[#8b93a6]">
                <div id="quiz"></div>
                <br>
                <div id="navButtons"></div>
            </div>
            <br>
            <br>
            <footer id="footer"></footer>
        </div>


        <script>
            let currentQn = 1
            let answers = [undefined, undefined, undefined, undefined]

            function updateQuizPage() {
                const quizPage1 = `
                <div class="flex flex-col gap-6 text-xl text-center">
                    <div class="flex flex-col gap-0 text-center">
                        <p class="px-4 text-4xl">Question 1:</p>
                        <p class="py-4 text-sm font-mono">blah blah blah blah blah</p>
                    </div>
                    <button onclick="answerButton(1, 1)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Response 1</button>
                    <button onclick="answerButton(2, 1)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Response 2</button>
                    <button onclick="answerButton(3, 1)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Response 3</button>
                    <button onclick="answerButton(4, 1)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Response 4</button>
                </div>
                `

                const quizPage2 = `
                <div class="flex flex-col gap-6 text-xl text-center">
                    <div class="flex flex-col gap-0 text-center">
                        <p class="px-4 text-4xl">Question 2:</p>
                        <p class="py-4 text-sm font-mono">SUIWHADHWODHWIFJEIOFJEWHOIFHWOFIHEOFHEOIFHE</p>
                    </div>
                    <button onclick="answerButton(1, 2)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">DWDIUUFGWU</button>
                    <button onclick="answerButton(2, 2)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">DUWHWD</button>
                    <button onclick="answerButton(3, 2)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">IJDEIOFOJIEOFWO</button>
                    <button onclick="answerButton(4, 2)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">:)</button>
                </div>
                `
                const quizPage3 = `
                <div class="flex flex-col gap-6 text-xl text-center">
                    <div class="flex flex-col gap-0 text-center">
                        <p class="px-4 text-4xl">Question 3:</p>
                        <p class="py-4 text-sm font-mono">DJIOEIFNIEFNFNKAIZERREICHFIEJFI</p>
                    </div>
                    <button onclick="answerButton(1, 3)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Fur</button>
                    <button onclick="answerButton(2, 3)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Kaizer</button>
                    <button onclick="answerButton(3, 3)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Gott</button>
                    <button onclick="answerButton(4, 3)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">und Vaterland</button>
                </div>
                `
                const quizPage4 = `
                <div class="flex flex-col gap-6 text-xl text-center">
                    <div class="flex flex-col gap-0 text-center">
                        <p class="px-4 text-4xl">Question 4:</p>
                        <p class="py-4 text-sm font-mono">67676767676767676767676767</p>
                    </div>
                    <button onclick="answerButton(1, 4)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">idk</button>
                    <button onclick="answerButton(2, 4)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">kys</button>
                    <button onclick="answerButton(3, 4)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">KEEP YOUSELF SAFE</button>
                    <button onclick="answerButton(4, 4)" class="p-4 rounded-xl bg-[#0a0b10]  border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">jk go die</button>
                </div>
                `

                const navPage1 = `
                <div class="content-center p-6 w-full">
                    <div class="flex flex-row gap-8 text-l items-center content-center">
                        <button onclick="prevButton()" class="p-4 rounded-xl bg-[#0a0b10] border-1 border-[#960000] hover:border-[#ff0000] hover:animate-pulse cursor-not-allowed">Previous Question</button>
                        <button onclick="nextButton()" class="p-4 rounded-xl bg-[#0a0b10] border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Next Question</button>
                    </div>
                </div>
                `
                const navPage2 = `
                <div class="content-center p-6 w-full">
                    <div class="flex flex-row gap-8 text-l items-center content-center">
                        <button onclick="prevButton()" class="p-4 rounded-xl bg-[#0a0b10] border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Previous Question</button>
                        <button onclick="nextButton()" class="p-4 rounded-xl bg-[#0a0b10] border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Next Question</button>
                    </div>
                </div>
                `
                const navPage3 = `
                <div class="content-center p-6 w-full">
                    <div class="flex flex-row gap-8 text-l items-center content-center">
                        <button onclick="prevButton()" class="p-4 rounded-xl bg-[#0a0b10] border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Previous Question</button>
                        <button onclick="nextButton()" class="p-4 rounded-xl bg-[#0a0b10] border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Next Question</button>
                    </div>
                </div>
                `
                const navPage4 = `
                <div class="content-center p-6 w-full">
                    <div class="flex flex-row gap-8 text-l items-center content-center">
                        <button onclick="prevButton()" class="p-4 rounded-xl bg-[#0a0b10] border-1 border-[#323c4d] hover:border-[#ffffff] hover:animate-pulse">Previous Question</button>
                        <button onclick="nextButton()" class="p-4 rounded-xl bg-[#0a0b10] border-1 border-[#960000] hover:border-[#ff0000] hover:animate-pulse cursor-not-allowed">Next Question</button>
                        <button onclick="nextButton()" class="p-4 rounded-xl bg-[#0a0b10] border-1 border-[#007822] hover:border-[#00e340] hover:animate-pulse">Submit Quiz</button>
                    </div>
                </div>
                `


                const quizDiv = document.getElementById("quiz")
                const navButtonsDiv = document.getElementById("navButtons")
                quizDiv.innerHTML = eval("quizPage" + currentQn)
                navButtonsDiv.innerHTML = eval("navPage" + currentQn)
            }

            function nextButton() {
                if (currentQn < 4) {
                    currentQn ++
                    updateQuizPage()
                }
            }

            function prevButton() {
                if (currentQn > 1) {
                    currentQn --
                    updateQuizPage()
                }
            }


            function answerButton(response, question) {
                answers[question - 1] = response
                console.log(answers)
            }
            window.addEventListener("DOMContentLoaded", () => {
                setTimeout(() => {
                    updateQuizPage()
                }, 0.1);
            });
        </script>
    </body>
</html>

<!doctype html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400..600&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css"
        />
        <link href="./dist/output.css" rel="stylesheet" />
        <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
        <script type="module" src="./js/technology.js"></script>
        <title>Space Technology | Universe Explorer</title>
        <style>
            .extra-info-wrap {
                display: grid;
                grid-template-rows: 0fr;
                opacity: 0;
                transition:
                    grid-template-rows 300ms ease,
                    opacity 250ms ease;
            }

            .extra-info-wrap.is-open {
                grid-template-rows: 1fr;
                opacity: 1;
            }

            .extra-info {
                overflow: hidden;
            }
        </style>
    </head>

    <body class="bg-background text-foreground font-sans">
        <button id="sidebar-btn" class="sidebar-toggle" aria-label="Open menu">
            <!-- injected via JS -->
        </button>

        <header>
            <!-- injected via JS -->
            <nav id="navbar"></nav>
        </header>

        <div class="page-shell">
            <main class="flex-1">
                <!-- ======= PAGE HEADER ======= -->
                <section id="intro" class="page-header animate-target">
                    <p class="eyebrow animate-target">
                        Technology beyond Earth
                    </p>

                    <h1 class="page-title animate-target">Space Technology</h1>

                    <p class="page-lede animate-target">
                        From observing distant galaxies to exploring the
                        surfaces of other worlds, these technologies have helped
                        deepen our understanding and exploration of space.
                    </p>
                </section>

                <!-- ======= TECHNOLOGY CARDS ======= -->
                <section
                    id="technologies"
                    aria-label="Space technologies"
                    class="content-container animate-target pb-24 md:pb-32 xl:pb-40"
                >
                    <div
                        id="technologies-list"
                        class="animate-target space-y-12"
                    ></div>
                </section>
            </main>

            <footer id="footer"></footer>
        </div>
    </body>
</html>
